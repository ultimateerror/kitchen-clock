<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>kitchen-clock</title>
		<style>
			html,
			body {
				--c-background: rgb(0 0 0);
				--c-text: rgb(255 255 255);
				--c-hint: rgb(255 255 255 / 0.7);

				background-color: var(--c-background);
				height: 100%;

				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					Roboto,
					Oxygen,
					Ubuntu,
					Cantarell,
					'Open Sans',
					'Helvetica Neue',
					sans-serif;

				display: grid;
				place-items: center;

				main {
					display: flex;
					flex-direction: column;

					.time {
						display: flex;
						color: var(--c-text);
						font-size: 20vmax;

						#second {
							color: var(--c-hint);
						}
					}

					color: var(--c-hint);

					.date {
						font-size: 200%;

						#weekday {
							display: block;
						}

						#day {
							font-weight: bold;
						}
					}
				}

				.literal {
					color: var(--c-hint);
					opacity: 0.4;
				}
			}
		</style>
	</head>

	<body>
		<main>
			<span class="time">
				<span id="hour"></span>
				<span class="literal">:</span>
				<span id="minute"></span>
				<span class="literal">:</span>
				<span id="second"></span>
			</span>

			<span id="weekday"></span>

			<div class="date">
				<span id="day"></span><span class="literal">.</span>
				<span id="monthAndYear"></span>
			</div>
		</main>

		<script>
			const weekdayFormatter = new Intl.DateTimeFormat('de-AT', {
				weekday: 'long'
			});

			const dateFormatter = new Intl.DateTimeFormat('de-AT', {
				year: 'numeric',
				month: 'long',
				day: '2-digit'
			});

			const timeFormatter = new Intl.DateTimeFormat('de-AT', {
				hour: '2-digit',
				minute: '2-digit',
				second: '2-digit'
			});

			const dateTimeFormatter = new Intl.DateTimeFormat('de-AT', {
				timeStyle: 'short'
			});

			function renderClock() {
				const now = new Date();

				const weekday = weekdayFormatter.format(now);
				const date = dateFormatter.format(now);
				const time = timeFormatter.format(now);

				const [hour, minute, second] = time.split(':');
				const [day, monthAndYear] = date.split('. ');

				document.querySelector('#hour').textContent = hour;
				document.querySelector('#minute').textContent = minute;
				document.querySelector('#second').textContent = second;

				document.querySelector('#day').textContent = day;
				document.querySelector('#monthAndYear').textContent = monthAndYear;
				document.querySelector('#weekday').textContent = weekday;

				document.title = dateTimeFormatter.format(now);
			}

			setInterval(renderClock, 100);
			renderClock();
		</script>
	</body>
</html>
